<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pizza - Pedido</title>
    <meta name="description" content="Formulario de pedido de pizza con HTML y PHP">
</head>
<body>
    <h1>Pedido de Pizza</h1>

    <form action="pedidos.php" method="post">
        Nombre:
        <input type="text" name="Nombre" required><br><br>

        Dirección:
        <input type="text" name="Direccion" required><br><br>

        Jamón y Queso:
        <input type="checkbox" name="JamonyQueso" value="1">
        Cantidad:
        <input type="number" name="Cant1" min="1" size="1"><br><br>

        Napolitana:
        <input type="checkbox" name="Napolitana" value="1">
        Cantidad:
        <input type="number" name="Cant2" min="1" size="1"><br><br>

        Mozzarella:
        <input type="checkbox" name="Mozzarella" value="1">
        Cantidad:
        <input type="number" name="Cant3" min="1" size="1"><br><br>

        <input type="submit" value="Confirmar">
    </form>
</body>
</html>
